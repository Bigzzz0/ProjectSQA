services:
  defects4j-env:
    image: docker-defects4j-env:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: defects4j_sqa
    shm_size: '2gb'
    volumes:
      - ../:/workspace
    tty: true
    stdin_open: true
    environment:
      - TZ=Asia/Bangkok
      - JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
      - PATH=/usr/lib/jvm/java-11-openjdk-amd64/bin:/opt/defects4j/framework/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
